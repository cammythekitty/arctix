# kitty.conf — dark/gold theme

# Font
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
font_size        11.0

# Cursor
cursor                  #C9A84C
cursor_text_color       #0E0E12
cursor_shape            beam
cursor_beam_thickness   1.5

# Scrollback
scrollback_lines 10000

# Mouse
mouse_hide_wait 3.0

# Window
remember_window_size    no
initial_window_width    100c
initial_window_height   30c
window_padding_width    10
placement_strategy      center

# Transparency + blur handled by hyprland, keep bg opaque
background_opacity 0.9

# Tabs
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_background      #0E0E12
tab_bar_margin_color    #0E0E12
active_tab_foreground   #0E0E12
active_tab_background   #C9A84C
active_tab_font_style   bold
inactive_tab_foreground #6B6B80
inactive_tab_background #141418

# Colors — dark moody gold
background            #0E0E12
foreground            #D4C5A0

selection_background  #C9A84C
selection_foreground  #0E0E12

# Black
color0  #141418
color8  #2A2A35

# Red
color1  #B05060
color9  #C06070

# Green
color2  #6A8C5A
color10 #7A9C6A

# Yellow / Gold
color3  #C9A84C
color11 #DDB85C

# Blue
color4  #5A7A9C
color12 #6A8AAC

# Magenta
color5  #8C5A8C
color13 #9C6A9C

# Cyan
color6  #5A8C8C
color14 #6A9C9C

# White
color7  #A09080
color15 #D4C5A0

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Misc
update_check_interval 0
close_on_child_death yes
